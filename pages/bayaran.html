<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kutipan Ditutup - Family Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/bayaran.css" />

  <!--
    Family Day 2026 telah DIBATALKAN — borang bayaran & QR ditutup.
    Borang asal masih ada dalam git history (dan js/bayaran.js) kalau perlu dibuka semula.
  -->
  <style>
    .tutup-box {
      background: #2b2b2b;
      border: 1px solid rgba(251, 176, 52, 0.4);
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      padding: 2rem 1.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .tutup-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .tutup-box h1 { font-size: 1.4rem; color: #fbb034; margin: 0 0 0.6rem; }
    .tutup-box p  { font-size: 0.92rem; line-height: 1.6; color: #ccc; margin: 0 0 0.6rem; }
    .tutup-box p strong { color: #fff; }
    .tutup-actions { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1.4rem; }
    .tutup-btn {
      display: block;
      text-decoration: none;
      font-weight: 600;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      transition: transform 0.2s ease;
    }
    .tutup-btn:hover { transform: scale(1.03); }
    .tutup-btn.primary   { background: #fbb034; color: #1e1e1e; }
    .tutup-btn.secondary { background: transparent; color: #fbb034; border: 1px solid #fbb034; }
  </style>
</head>
<body>
  <div class="tutup-box">
    <div class="tutup-icon">🔒</div>
    <h1>Kutipan Telah Ditutup</h1>
    <p>Hussin Legacy Family Day 2026 telah <strong>dibatalkan</strong>.</p>
    <p>
      Sila <strong>jangan buat sebarang bayaran baru</strong>.
      Semua bayaran yang telah dibuat akan dipulangkan sepenuhnya kepada setiap keluarga.
    </p>

    <div class="tutup-actions">
      <a href="refund.html" class="tutup-btn primary">💸 Semak Status Refund</a>
      <a href="../index.html" class="tutup-btn secondary">🏠 Kembali ke Laman Utama</a>
    </div>
  </div>
</body>
</html>
